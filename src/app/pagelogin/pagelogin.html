
<div class="login-container">

    <div class="login-card">

        <h1>Login</h1>

        <input
            type="email"
            placeholder="Enter Email"
            [(ngModel)]="userdto.email">

        <input
            type="password"
            placeholder="Enter Password"
            [(ngModel)]="userdto.password">

        <button class="lgn" (click)="checkUser()">
            Login
        </button>

    </div>

</div>
